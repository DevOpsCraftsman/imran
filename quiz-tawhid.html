<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عمران - علوم التوحيد</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0c29" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow-x: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 95%;
      max-width: 650px;
      text-align: center;
      padding: 2rem;
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
    }

    .disclaimer {
      font-size: 0.95rem;
      color: #f9d423;
      background: rgba(249, 212, 35, 0.1);
      padding: 1.5rem;
      border-radius: 1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
      border: 1px solid rgba(249, 212, 35, 0.3);
      text-align: justify;
    }

    h1 {
      margin-bottom: 1.5rem;
      font-size: 2rem;
      background: linear-gradient(90deg, #f9d423, #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .question-card {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    .question-card.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .question-text {
      font-size: 1.6rem;
      font-weight: bold;
      margin-bottom: 2rem;
      color: #12c2e9;
      line-height: 1.5;
    }

    .options {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .option {
      padding: 1.2rem;
      font-size: 1.3rem;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .option:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .option.correct {
      background: rgba(46, 213, 115, 0.3);
      border-color: #2ed573;
    }

    .option.wrong {
      background: rgba(255, 71, 87, 0.3);
      border-color: #ff4757;
    }

    .progress {
      margin-bottom: 1.5rem;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .result-card {
      display: none;
    }

    .score {
      font-size: 4.5rem;
      font-weight: bold;
      margin: 1.5rem 0;
      color: #f9d423;
    }

    .btn-action {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2.5rem;
      background: linear-gradient(90deg, #12c2e9, #c471ed);
      color: white;
      text-decoration: none;
      border-radius: 2.5rem;
      font-weight: bold;
      transition: transform 0.2s;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .btn-action:hover {
      transform: scale(1.05);
    }

    .btn-back {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      transition: color 0.2s;
      z-index: 2;
    }

    .btn-back:hover {
      color: white;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="container">
    <a href="index.html" class="btn-back" title="العودة للرئيسية">✕</a>
    
    <div id="start-screen">
      <h1>علوم التوحيد</h1>
      <div class="disclaimer" id="quiz-disclaimer"></div>
      <button onclick="startQuiz()" class="btn-action">ابدأ الاختبار</button>
    </div>

    <div id="quiz-area" style="display:none;">
      <div class="progress">السؤال <span id="current-idx">1</span> من <span id="total-qs">0</span></div>
      <div id="question-container"></div>
    </div>

    <div id="result-area" class="result-card">
      <h2>النتيجة النهائية</h2>
      <div class="score" id="final-score">0 / 0</div>
      <p id="feedback-msg" style="font-size: 1.3rem;"></p>
      <a href="index.html" class="btn-action">العودة للرئيسية</a>
    </div>

    <footer>المصدر: al-badr.net</footer>
  </div>

  <script src="tawhid-data.js"></script>
  <script>
    let currentQuestionIdx = 0;
    let score = 0;
    let canAnswer = true;

    document.getElementById('quiz-disclaimer').textContent = tawhidQuiz.metadata.disclaimer;
    document.getElementById('total-qs').textContent = tawhidQuiz.questions.length;

    function initStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--d', (1.5 + Math.random() * 3).toFixed(2) + 's');
        s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
        container.appendChild(s);
      }
    }

    function startQuiz() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-area').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      const q = tawhidQuiz.questions[currentQuestionIdx];
      const container = document.getElementById('question-container');
      document.getElementById('current-idx').textContent = currentQuestionIdx + 1;
      
      let optionsHtml = q.options.map(opt => `
        <div class="option" onclick="checkAnswer(this, '${opt}')">${opt}</div>
      `).join('');

      container.innerHTML = `
        <div class="question-card active">
          <div class="question-text">${q.q}</div>
          <div class="options">
            ${optionsHtml}
          </div>
        </div>
      `;
      canAnswer = true;
    }

    function checkAnswer(element, selected) {
      if (!canAnswer) return;
      canAnswer = false;

      const q = tawhidQuiz.questions[currentQuestionIdx];
      const correct = q.correct;
      const options = document.querySelectorAll('.option');

      options.forEach(opt => {
        if (opt.textContent === correct) opt.classList.add('correct');
        if (opt === element && selected !== correct) opt.classList.add('wrong');
      });

      if (selected === correct) score++;

      setTimeout(() => {
        currentQuestionIdx++;
        if (currentQuestionIdx < tawhidQuiz.questions.length) {
          showQuestion();
        } else {
          showResults();
        }
      }, 2000);
    }

    function showResults() {
      document.getElementById('quiz-area').style.display = 'none';
      document.getElementById('result-area').style.display = 'block';
      document.getElementById('final-score').textContent = `${score} / ${tawhidQuiz.questions.length}`;
      
      let msg = "";
      if (score === tawhidQuiz.questions.length) msg = "ما شاء الله! ممتاز. ثبتك الله على التوحيد";
      else if (score >= 7) msg = "جيد جداً! واصل تعلم العقيدة الصحيحة";
      else if (score >= 5) msg = "بداية طيبة، ينصح بمراجعة دروس الشيخ عبد الرزاق البدر";
      else msg = "عليك بمراجعة كتاب التوحيد والأصول الثلاثة";
      
      document.getElementById('feedback-msg').textContent = msg;
    }

    initStars();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW registration failed!', err));
      });
    }
  </script>
</body>
</html>
