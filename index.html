<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>عمران</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0c29" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c29;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d) ease-in-out infinite;
      opacity: 0;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .card {
      text-align: center;
      padding: 3rem 4rem;
      border-radius: 2rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #f9d423, #ff4e50, #c471ed, #12c2e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
    }

    .tagline {
      margin-bottom: 2rem;
      font-size: 1.5rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.05em;
    }

    .btn-exercises {
      display: block;
      margin: 1rem auto;
      width: 100%;
      max-width: 280px;
      padding: 1rem 1.5rem;
      background: linear-gradient(90deg, #12c2e9, #c471ed);
      color: white;
      text-decoration: none;
      border-radius: 2.5rem;
      font-weight: bold;
      transition: all 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
    }

    .btn-tawhid {
      background: linear-gradient(90deg, #f9d423, #ff4e50);
    }

    .btn-exercises:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      filter: brightness(1.1);
    }
  </style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="card">
    <h1>عمران</h1>
    <p class="tagline">أهلاً بكم في صفحتي</p>
    <div style="margin-top: 2rem;">
      <a href="quiz.html" class="btn-exercises">مفردات اللغة العربية</a>
      <a href="quiz-tawhid.html" class="btn-exercises btn-tawhid">علوم التوحيد</a>
    </div>
  </div>

  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left   = Math.random() * 100 + '%';
      s.style.top    = Math.random() * 100 + '%';
      s.style.setProperty('--d', (1.5 + Math.random() * 3).toFixed(2) + 's');
      s.style.animationDelay = (Math.random() * 4).toFixed(2) + 's';
      container.appendChild(s);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered!', reg))
          .catch(err => console.log('SW registration failed!', err));
      });
    }
  </script>
</body>
</html>
